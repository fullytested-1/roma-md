    name: roma-md
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION_ID
        sync: false
      - key: PAIR_WEB_URL
        value: "https://modest-sacha-boyscro-50785a59.koyeb.app"
